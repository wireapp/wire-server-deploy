# Image digests are not supported by our `wire-server-deploy` machinery.
# They cannot be correctly dumped to tar files and then be loaded by
# `containerd`.
ingress-nginx:
  controller:
    # There's no loadbalancer support in the Hetzner CI environment
    kind: DaemonSet
    service:
      type: NodePort
    config:
      # Controller >= 1.12 defaults to "High" and rejects ingresses with
      # *-snippet annotations (risk "Critical"), e.g. the minio, nginz and
      # federator ingresses of nginx-ingress-services.
      annotations-risk-level: Critical
    image:
      # Patched build of https://github.com/chainguard-forks/ingress-nginx controller-v1.15.16
      # (NGINX fixes for CVE-2026-123007 / CVE-2026-123633), see CO-79.
      # Timestamped tag = sha256:ceab4e092799cb93beb3dae20bd06c5902022ead7e6c51b3c8fc554332ebecd5
      repository: quay.io/wire/ingress-nginx-chainguard/controller
      tag: "v1.15.16-20261119135009.gb3cf87b"
      digest: ""
      digestChroot: ""
    admissionWebhooks:
      patch:
        image:
          tag: "v1.6.9"
          digest: ""
    # Enable prometheus operator to scrape metrics from the ingress-nginx controller with servicemonitor.
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false