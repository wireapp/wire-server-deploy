# Image digests are not supported by our `wire-server-deploy` machinery.
# They cannot be correctly dumped to tar files and then be loaded by
# `containerd`.
ingress-nginx:
  controller:
    # There's no loadbalancer support in the Hetzner CI environment
    kind: Deployment
    service:
      type: NodePort
    config:
      # Controller >= 1.12 defaults to "High" and rejects ingresses with
      # *-snippet annotations (risk "Critical"), e.g. the minio, nginz and
      # federator ingresses of nginx-ingress-services.
      annotations-risk-level: Critical
    image:
      tag: "v1.13.9"
      digest: ""
      digestChroot: ""
    admissionWebhooks:
      patch:
        image:
          tag: "v1.6.9"
          digest: ""

    # Enable prometheus operator to scrape metrics from the ingress-nginx controller with servicemonitor.
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
